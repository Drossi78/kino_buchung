<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino Ticketbuchung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kino Ticketbuchung</h1>
        <nav>
            <ul>
                <li><a href="#">Startseite</a></li>
                <li><a href="#">Meine Buchungen</a></li>
                <li><a href="#" onclick="showLoginForm()">Anmelden</a></li>
                <li><a href="#" onclick="showRegisterForm()">Registrieren</a></li>
            </ul>
        </nav>
    </header>

    <section id="register-form" style="display: none;">
        <h2>Registrieren</h2>
        <form id="registerForm">
            <label for="register-name">Name:</label>
            <input type="text" id="register-name" required>
            <label for="register-email">Email:</label>
            <input type="email" id="register-email" required>
            <label for="register-password">Password:</label>
            <input type="password" id="register-password" required>
            <button type="submit">Registrieren</button>
        </form>
    </section>

    <section id="login-form" style="display: none;">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required>
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required>
            <button type="submit">Anmelden</button>
        </form>
    </section>

    <section id="movies">
        <h2>Verfügbare Filme</h2>
        <!-- Die Filme werden hier dynamisch hinzugefügt -->
    </section>

    <footer>
        <p>&copy; 2025 Kino Booking. Alle Rechte vorbehalten.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
